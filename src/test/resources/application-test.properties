# test configuratie — H2 in-memory ipv postgres, geen keycloak nodig
spring.datasource.url=jdbc:h2:mem:automaat_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.sql.init.mode=never

# blijven staan zodat de @Value injectie werkt; de decoder wordt in tests gemockt
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/automaat
spring.security.oauth2.resourceserver.jwt.audiences=automaat-api

automaat.upload-location=target/test-uploads
